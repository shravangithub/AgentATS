 /* ===== Dizno-inspired design system (theme layer) ===== */
 :root{--ink:#141318;--ink-soft:#2A2730;--paper:#F4F2F7;--surface:#fff;--violet:#6C4CF1;--violet-700:#5436D6;--violet-900:#3A2599;--violet-50:#EEEAFF;--violet-100:#DCD3FF;--green:#13A463;--green-700:#0E8351;--green-50:#E3F6EC;--green-100:#C5E9D3;--brt-red:#F0432E;--brt-blue:#2D5BFF;--brt-yellow:#F2C200;--n50:#F5F4F8;--n100:#EDEBF2;--n200:#E0DDE8;--n300:#C9C5D4;--n400:#9C97AC;--n500:#736E83;--n600:#534F60;--n700:#373343;--advance:#13A463;--hold:#C98A1E;--reject:#F0432E;--disp:"Space Grotesk",system-ui,sans-serif;--bodyf:"Hanken Grotesk",system-ui,sans-serif;--mono:"Space Grotesk",system-ui,sans-serif}

 .bar button.primary:hover{background:var(--violet-700)}
 #chat,#chatform{background:transparent}#chatform{background:var(--surface);border-top:1px solid var(--n200)}
 .me{background:var(--violet);color:#fff}.bot{background:var(--surface);border-color:var(--n200)}
 #box{border-color:var(--n300);border-radius:11px}
 #clip,#chatform button{border-radius:11px}#chatform button{background:var(--violet)}#chatform button:hover{background:var(--violet-700)}#clip{background:var(--violet-50);color:var(--violet-700)}
 #panel{border-radius:18px;max-width:min(1040px,95vw);max-height:94vh}

 #panel h4{color:var(--n500)}

 .cancel{background:var(--surface);border:1px solid var(--n300);color:var(--ink);border-radius:10px}.cancel:hover{background:var(--n50);border-color:var(--n400)}

 .stageh{color:var(--n600)}

 .chip{background:var(--violet-50);color:var(--violet-700);border-color:var(--violet-100)}.chip.on{background:var(--violet);color:#fff;border-color:var(--violet)}

 .fld input,.fld select,.fld textarea{border-color:var(--n300);border-radius:10px}.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-100)}
 .srow input{border-color:var(--n300)}.srow input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-100)}

 .rcard,.ccard,.sr{border-color:var(--n200);border-radius:14px}.rcard:hover,.ccard:hover,.sr:hover{border-color:var(--violet-100);box-shadow:0 10px 28px -14px rgba(108,76,241,.28)}

 /* ===== Redesigned nav chrome ===== */
 header .navbar{max-width:1320px;margin:0 auto;width:100%}
 .top{display:flex;align-items:center;gap:16px;padding:2px 0 12px}

</style></head>

function _grpRole(n){n=(n||'').toLowerCase();if(/engineering leadership|executive|chief of staff/.test(n))return '1· Leadership';if(/technical ic|devops|sre|platform|security engineering|qa|test|hardware|embedded|solutions|sales engineering/.test(n))return '2· Engineering & Technical';if(/data\/ml|data science|analytics|research|scientific/.test(n))return '3· Data, AI & Research';if(/product|design|ux/.test(n))return '4· Product & Design';if(/gtm|commercial|marketing|customer|success/.test(n))return '5· Go-to-Market';if(/finance|quant|risk|actuar|investment|portfolio/.test(n))return '6· Finance & Risk';if(/legal|compliance|policy|government|esg|sustainab|consult|strategy/.test(n))return '7· Strategy, Legal & Public';if(/hr|talent|recruit|operations|pmo|people|program management|bizops|supply chain|logistics/.test(n))return '8· Ops, People & PM';return '9· General';}

function openRubricCfg(reqId){if(!reqId)reqId=window._reqId;panel.innerHTML='<h3>⚖️ Rubric settings</h3><div class="sub2" style="margin-bottom:8px">Role &amp; company archetype + selection bar used to score this requisition.</div><div id="rcfg">Loading…</div><div class="acts"><button class="cancel" onclick="openRubricRank(\''+reqId+'\')">Back</button><button class="save" onclick="saveRubricCfg(\''+reqId+'\')">Save &amp; re-rank</button></div>';overlay.style.display="flex";GSRUN().withSuccessHandler(function(o){GSRUN().withSuccessHandler(function(cur){cur=cur||{};function sel(n,arr,v){return '<div class="fld"><label>'+n+'</label><select name="'+n+'"><option value="">—</option>'+(arr||[]).map(function(x){return '<option'+(x===v?" selected":"")+'>'+esc2(x)+'</option>';}).join("")+'</select></div>';}var el=document.getElementById("rcfg");if(el)el.innerHTML=groupedSelect("Role",o.archetypes,cur.role,_grpRole)+groupedSelect("Company",o.companies,cur.company,_grpCo)+sel("Threshold",o.thresholds,cur.threshold||"Balanced");}).getRubricConfig(reqId);}).tr_options();}
function saveRubricCfg(reqId){var v=collect();GSRUN().withSuccessHandler(function(){openRubricRank(reqId);}).withFailureHandler(function(x){warn("⚠️ "+x.message);}).setRubricConfig(reqId,v.Role,v.Company,v.Threshold);}
function regenSP(reqId){var el=document.getElementById('srbody');if(el)el.innerHTML='Regenerating success profile & re-ranking… (a few seconds)';GSRUN().withSuccessHandler(function(){openStackRank(reqId);}).withFailureHandler(function(x){if(el)el.innerHTML='⚠️ '+esc2(x.message);}).getSuccessProfile(reqId,true);}
function openRediscover(reqId){panel.innerHTML='<div class="nav"><a onclick="openPipeline(\''+reqId+'\')">← Pipeline</a></div><h3>♻️ Talent rediscovery</h3><div class="sub2" style="margin-bottom:8px">Past candidates &amp; Talent-Pool people, surfaced and <b>re-ranked against the role success profile</b> (same engine as Stack rank).</div><div id="rdbody">Scanning your talent base…</div><div class="acts"><button class="cancel" onclick="openPipeline(\''+reqId+'\')">Close</button></div>';overlay.style.display='flex';GSRUN().withSuccessHandler(function(r){var el=document.getElementById('rdbody');if(!el)return;if(!r){el.textContent='No data.';return;}var list=(r.ranked&&r.ranked.length)?r.ranked:(r.candidates||[]);if(!list.length){el.innerHTML='<p style="color:#777">No matching past candidates found. Add 🎯 Calibration or skills to this req to improve matching.</p>';return;}var sp=r.sp||{};var spHtml=(sp.market_note||sp.exp_max)?('<div class="bb" style="background:#f0f7f2"><b>🎯 Role success profile</b><div class="sub2" style="margin-top:3px">'+((sp.exp_min||sp.exp_max)?('Experience '+esc2(sp.exp_min)+'–'+esc2(sp.exp_max)+' yrs (ideal '+esc2(sp.exp_ideal)+')'):'')+((sp.core_skills&&sp.core_skills.length)?' · Core: '+esc2(sp.core_skills.slice(0,6).join(", ")):'')+'</div>'+(sp.market_note?'<div class="sub2" style="margin-top:3px;color:#555">'+esc2(sp.market_note)+'</div>':'')+'</div>'):'';el.innerHTML=spHtml+'<div class="sub2" style="margin-bottom:6px">Matching on: '+r.terms.map(esc2).join(', ')+'</div>'+list.map(function(c){var col=(c.score>=70?"#1f7a4d":(c.score>=45?"#b06a00":"#9a3b3b"));return '<div class="sr"><button onclick="tagToReq(\''+c.candId+'\',\''+reqId+'\')" style="background:#3a6ea5;color:#fff;border:0;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;float:right">+ Add to req</button><b style="cursor:pointer" onclick="_reqId=\''+(c.reqId||'')+'\';openCandidate(\''+c.candId+'\')">'+esc2(maskName(c.name,c.candId))+'</b>'+(c.pool?' <span class="sub2" style="color:#1f7a4d">🌱 Talent Pool</span>':'')+(c.score!=null?' <b style="color:'+col+'">· '+c.score+'</b>':'')+'<div class="sub2">'+[c.title,c.company,c.exp?c.exp+'y':'',c.stage].filter(Boolean).map(esc2).join(' · ')+(c.coverage!=null?' · must-haves '+c.coverage+'%':'')+(c.expFit!=null?' · exp-fit '+c.expFit+'%':'')+'</div>'+(c.score!=null?matchBar(c.score):'')+(c.reason?'<div class="sub2" style="color:#555;margin-top:3px">'+esc2(c.reason)+'</div>':'')+((c.matched&&c.matched.length)?'<div class="sub2" style="color:#2f6f4f">✓ '+c.matched.slice(0,8).map(esc2).join(', ')+'</div>':'')+'</div>';}).join('');}).withFailureHandler(function(x){document.getElementById('rdbody').innerHTML='⚠️ '+x.message;}).rediscoverTalent(reqId);}
function tagToReq(candId,reqId){GSRUN().withSuccessHandler(function(r){add(r,'bot');openRediscover(reqId);}).withFailureHandler(function(x){warn('⚠️ '+x.message);}).tagCandidateToReq(candId,reqId);}
function openInsights(){panel.innerHTML='<h3>🔔 Pipeline insights</h3><div id="insbody">Analyzing the pipeline…</div><div class="acts"><button class="cancel" onclick="closeModal()">Close</button></div>';overlay.style.display='flex';GSRUN().withSuccessHandler(function(r){var el=document.getElementById('insbody');if(!el)return;if(!r){el.textContent='No data.';return;}var stages=Object.keys(r.byStage).map(function(s){return stChip(s)+' '+r.byStage[s];}).join(' &nbsp; ');var ag=(r.aging&&r.aging.length)?r.aging.map(function(c){return '<div class="sr" onclick="closeModal();_reqId=\''+c.reqId+'\';openCandidate(\''+c.candId+'\')"><b>'+esc2(maskName(c.name,c.candId))+'</b> '+stChip(c.stage)+' <span class="sub2">'+c.days+' days in current stage'+(c.reqId?' · '+esc2(c.reqId):'')+'</span></div>';}).join(''):'<p style="color:#777">No candidates stuck beyond 10 days. 🎉</p>';var m=r.metrics||{};var per=(m.perStage&&m.perStage.length)?'<h4>Avg time per stage</h4>'+m.perStage.map(function(p){return '<div class="sub2">'+stChip(p.stage)+' '+p.avgDays+' day'+(p.avgDays===1?'':'s')+'</div>';}).join(''):'';el.innerHTML='<div class="bb"><b>'+r.active+'</b> active candidates'+(m.avgTimeToHire!=null?' &nbsp;·&nbsp; <b>'+m.avgTimeToHire+'</b> day avg time-to-hire ('+m.hiredCount+' hired)':'')+'</div><div style="margin:10px 0;line-height:2">'+stages+'</div><h4>⏳ Stuck (10+ days in current stage)</h4>'+ag+per;}).withFailureHandler(function(x){document.getElementById('insbody').innerHTML='⚠️ '+x.message;}).pipelineInsights();}
function openGraphMatch(candId){panel.innerHTML='<div class="nav"><a onclick="openCandidate(\''+candId+'\')">← Candidate</a></div><h3>🕸 Skills-graph match</h3><div class="sub2" style="margin-bottom:8px">Each requirement checked against the candidate\'s skill graph — direct, implied, or bridged via an adjacent/transferable skill.</div><div id="gmbody">Building skill graph &amp; matching… (a few seconds)</div><div class="acts"><button class="cancel" onclick="openCandidate(\''+candId+'\')">Back</button></div>';overlay.style.display="flex";GSRUN().withSuccessHandler(function(r){var el=document.getElementById("gmbody");if(!el)return;if(!r||r.error){el.innerHTML='<p style="color:#777">'+esc2((r&&r.error)||"No data")+'</p>';return;}if(!r.count){el.innerHTML='<p style="color:#777">No must-haves or benchmark signals set for this requisition yet. Add 🎯 Calibration or 📊 Benchmark to enable graph matching.</p>';return;}var ic={explicit:"✅",implied:"◐",adjacent:"↔",none:"❌"},lc={explicit:"Direct",implied:"Implied",adjacent:"Adjacent (transferable)",none:"Gap"},cl={explicit:"#1f7a4d",implied:"#2f7d5b",adjacent:"#b06a00",none:"#9a3b3b"};var col=r.pct>=70?"#1f7a4d":(r.pct>=45?"#b06a00":"#9a3b3b");var rows=r.coverage.map(function(c){return '<div class="sub2" style="color:'+cl[c.via]+'">'+ic[c.via]+' '+esc2(c.req)+' <span style="opacity:.7">— '+lc[c.via]+'</span></div>';}).join("");var gph=function(a,lbl){return (a&&a.length)?'<div class="sub2"><b>'+lbl+':</b> '+a.map(esc2).join(", ")+'</div>':"";};el.innerHTML='<div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><div style="font-size:32px;font-weight:800;color:'+col+'">'+r.pct+'%</div><div><b>'+r.covered+' / '+r.count+'</b> requirements covered'+(r.seniority?'<div class="sub2">Seniority: '+esc2(r.seniority)+'</div>':"")+'</div></div><h4>Requirement coverage</h4>'+rows+'<h4>Candidate skill graph</h4>'+gph(r.graph.explicit,"Explicit")+gph(r.graph.implied,"Implied")+gph(r.graph.adjacent,"Adjacent");}).withFailureHandler(function(x){document.getElementById("gmbody").innerHTML="⚠️ "+x.message;}).graphMatch(candId);}
function openFitScore(candId){panel.innerHTML='<div class="nav"><a onclick="openCandidate(\''+candId+'\')">← Candidate</a></div><h3>🎯 Fit score</h3><div id="fitbody">Scoring against the requisition, calibration &amp; weights…</div><div class="acts"><button class="cancel" onclick="openCandidate(\''+candId+'\')">Back</button></div>';overlay.style.display='flex';GSRUN().withSuccessHandler(function(r){var el=document.getElementById('fitbody');if(!el)return;if(!r||r.error){el.innerHTML='<p style="color:#777">'+esc2((r&&r.error)||'No data')+'</p>';return;}var col=r.total>=70?'#1f7a4d':(r.total>=45?'#b06a00':'#9a3b3b');var bars=(r.components||[]).map(function(c){var cc=c.score>=70?'#1f7a4d':(c.score>=45?'#b06a00':'#9a3b3b');return '<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>'+esc2(c.label)+' <span class="sub2">· weight '+c.weight+' → +'+c.contribution+'</span></span><b>'+c.score+'</b></div><div style="background:#eee;border-radius:5px;height:9px"><div style="width:'+c.score+'%;background:'+cc+';height:9px;border-radius:5px"></div></div></div>';}).join('');var cov=(r.coverage||[]).map(function(c){return '<div class="sub2">'+(c.met?'✅':'❌')+' '+esc2(c.item)+'</div>';}).join('');el.innerHTML='<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px"><div style="font-size:34px;font-weight:800;color:'+col+'">'+esc2(String(r.total))+'<span style="font-size:16px;color:#999">/100</span></div><div><b>'+esc2(r.recommendation)+'</b><div class="sub2">'+esc2(r.archetype)+' weighting · <a onclick="openFitConfig(\''+r.reqId+'\')" style="cursor:pointer;color:#3a6ea5">⚖️ edit weights</a></div>'+(r.semantic!=null?'<div class="sub2">Semantic JD match: <b>'+r.semantic+'%</b> (objective embedding)</div>':'')+(r.gated?'<div class="sub2" style="color:#9a3b3b">⚠️ Low role relevance (skills+domain) — score capped. This candidate doesn\'t match the role\'s core requirements.</div>':'')+(r.hasCalibration?'':'<div class="sub2">⚠️ No calibration on this req — add 🎯 Calibration for sharper must-have scoring.</div>')+'</div></div>'+(r.summary?'<div class="bb">'+esc2(r.summary)+'</div>':'')+'<h4>Weighted breakdown</h4>'+bars+(cov?'<h4>Must-have coverage</h4>'+cov:'')+(r.strengths&&r.strengths.length?'<h4>Strengths</h4><div class="sub2" style="color:#1f7a4d">'+r.strengths.map(esc2).join('<br>')+'</div>':'')+(r.gaps&&r.gaps.length?'<h4>Gaps / risks</h4><div class="sub2" style="color:#9a3b3b">'+r.gaps.map(esc2).join('<br>')+'</div>':'')+(r.focus&&r.focus.length?'<h4>Suggested interview focus</h4><div class="sub2">'+r.focus.map(esc2).join('<br>')+'</div>':'');}).withFailureHandler(function(x){document.getElementById('fitbody').innerHTML='⚠️ '+x.message;}).fitScore(candId);}
function openFitConfig(reqId){panel.innerHTML='<div class="nav"><a onclick="openPipeline(\''+reqId+'\')">← Pipeline</a></div><h3>⚖️ Fit-score weights</h3><div class="sub2" style="margin-bottom:8px">Pick a company archetype to load preset weights, then fine-tune. Weights set how much each factor counts. They don\'t need to sum to 100 — scores are normalized.</div><div id="fcbody">Loading…</div><div class="acts"><button class="cancel" onclick="openPipeline(\''+reqId+'\')">Back</button><button class="save" onclick="saveFitCfg(\''+reqId+'\')">Save weights</button></div>';overlay.style.display='flex';GSRUN().withSuccessHandler(function(d){window._fp=d.presets;window._fl=d.labels;window._fk=d.keys;GSRUN().withSuccessHandler(renderFitCfg).getFitConfig(reqId);}).getFitPresets();}
function renderFitCfg(c){var presets=window._fp,labels=window._fl,keys=window._fk;var opts=Object.keys(presets).map(function(a){return '<option'+(a===c.archetype?' selected':'')+'>'+esc2(a)+'</option>';}).join('')+'<option'+(c.archetype==='Custom'?' selected':'')+'>Custom</option>';var rows=keys.map(function(k){var v=c.weights[k]||0;return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:3px"><span>'+esc2(labels[k])+'</span><span><b id="pct_'+k+'" style="color:#1f7a4d">0%</b> <span class="sub2">(<span id="val_'+k+'">'+v+'</span>)</span></span></div><input type="range" name="w_'+k+'" min="0" max="100" value="'+v+'" oninput="fcSum()" style="width:100%;accent-color:#2f6f4f"></div>';}).join('');document.getElementById('fcbody').innerHTML='<div class="fld"><label>Company archetype</label><select id="fcArch" onchange="fcPreset()">'+opts+'</select></div><div class="sub2" style="margin:4px 0 10px">Drag to set how much each factor matters. The <b>%</b> is each factor\'s normalized share of the score — they always add to 100%.</div>'+rows+'<div class="bb" id="fcsum" style="margin-top:8px;background:#f3f7fb"></div>';fcSum();}
function fcPreset(){var a=document.getElementById('fcArch').value;var p=(window._fp||{})[a];if(!p)return;(window._fk||[]).forEach(function(k){var el=panel.querySelector('[name="w_'+k+'"]');if(el&&p[k]!=null)el.value=p[k];});fcSum();}
function fcSum(){var keys=window._fk||[],labels=window._fl||{},tot=0;keys.forEach(function(k){var el=panel.querySelector('[name="w_'+k+'"]');if(el)tot+=Number(el.value||0);});var top='',topp=-1;keys.forEach(function(k){var el=panel.querySelector('[name="w_'+k+'"]');var v=el?Number(el.value||0):0;var pct=tot?Math.round(v/tot*100):0;var pe=document.getElementById('pct_'+k);if(pe)pe.textContent=pct+'%';var ve=document.getElementById('val_'+k);if(ve)ve.textContent=v;if(pct>topp){topp=pct;top=labels[k]||k;}});var se=document.getElementById('fcsum');if(!se)return;if(tot===100){se.style.background='#eef7f0';se.innerHTML='✅ Total = <b>100</b>. Biggest driver: <b>'+esc2(top)+'</b> ('+topp+'%).';}else{se.style.background='#fdeaea';se.innerHTML='⚠️ Total = <b>'+tot+'</b> — must equal <b>100</b>. <a onclick="balanceWeights()" style="cursor:pointer;color:#3a6ea5;font-weight:600">Balance to 100%</a>';}}
function balanceWeights(){var keys=window._fk||[],tot=0;keys.forEach(function(k){var el=panel.querySelector('[name="w_'+k+'"]');if(el)tot+=Number(el.value||0);});if(!tot){warn('Set at least one weight above 0 first.');return;}var acc=0,last=null;keys.forEach(function(k){var el=panel.querySelector('[name="w_'+k+'"]');if(!el)return;last=el;var v=Math.round(Number(el.value||0)/tot*100);el.value=v;acc+=v;});if(last)last.value=Math.max(0,Number(last.value)+(100-acc));fcSum();}
function saveFitCfg(reqId){var w={},tot=0;(window._fk||[]).forEach(function(k){var el=panel.querySelector('[name="w_'+k+'"]');var v=el?Number(el.value||0):0;w[k]=v;tot+=v;});if(tot!==100){warn('⚠️ Weights total '+tot+ '% — they must add up to 100. Click "Balance to 100%".');return;}var a=document.getElementById('fcArch').value;var th=add('saving fit weights…','bot think');GSRUN().withSuccessHandler(function(r){th.remove();add(r,'bot');markDirty();openPipeline(reqId);}).withFailureHandler(function(x){th.remove();warn('⚠️ '+x.message);}).saveFitConfig(reqId,a,w);}
function openSkills(candId){panel.innerHTML='<div class="nav"><a onclick="openCandidate(\''+candId+'\')">← Candidate</a></div><h3>🧬 Skills inference</h3><div class="sub2" style="margin-bottom:8px">Explicit, implied &amp; adjacent skills (ESCO / O*NET-style adjacency) + seniority signal.</div><div id="skbody">Inferring skills…</div><div class="acts"><button class="cancel" onclick="openCandidate(\''+candId+'\')">Back</button></div>';overlay.style.display='flex';GSRUN().withSuccessHandler(function(r){var el=document.getElementById('skbody');if(!el)return;if(!r||r.error){el.innerHTML='<p style="color:#777">'+esc2((r&&r.error)||'No data')+'</p>';return;}function chips(arr,col){return (arr&&arr.length)?arr.map(function(s){return '<span style="display:inline-block;background:'+col+';border-radius:14px;padding:2px 10px;margin:3px 3px 0 0;font-size:12px">'+esc2(s)+'</span>';}).join(''):'<span class="sub2">—</span>';}el.innerHTML=(r.seniority?'<div class="bb"><b>Seniority signal:</b> '+esc2(r.seniority)+'</div>':'')+'<h4>Explicit skills</h4>'+chips(r.explicit,'#e6f3ea')+'<h4>Implied skills</h4>'+chips(r.implied,'#eef3f8')+'<h4>Adjacent — could ramp into quickly</h4>'+chips(r.adjacent,'#f4f0fb');}).withFailureHandler(function(x){document.getElementById('skbody').innerHTML='⚠️ '+x.message;}).inferSkills(candId);}
function reparseCv(candId){var th=add('re-parsing CV & filling missing fields…','bot think');GSRUN().withSuccessHandler(function(r){th.remove();add(r,'bot');openCandidate(candId);}).withFailureHandler(function(x){th.remove();warn('⚠️ '+x.message);}).reparseCandidate(candId);}
function openEmailCandidate(candId){panel.innerHTML='<div class="nav"><a onclick="openCandidate(\''+candId+'\')">← Candidate</a></div><h3>✉️ Email candidate</h3><div class="sub2" style="margin-bottom:8px">Pick a purpose, draft with AI, review, then send. The email goes to the candidate from your Gmail.</div>'+fld('Purpose','emKind','select',['Move forward / next round','Reject (kind)','Offer','Thank you for interviewing'])+'<button class="save" onclick="draftEmail(\''+candId+'\')">✨ Draft with AI</button> <span id="emStatus" class="sub2"></span>'+fld('Subject','emSubject')+fld('Message','emBody','textarea')+'<div class="acts"><button class="cancel" onclick="openCandidate(\''+candId+'\')">Back</button><button class="save" onclick="sendCandEmail(\''+candId+'\')">Send email</button></div>';overlay.style.display='flex';var b=panel.querySelector('[name="emBody"]');if(b)b.rows=8;}
function draftEmail(candId){var v=collect();var map={'Move forward / next round':'advance','Reject (kind)':'reject','Offer':'offer','Thank you for interviewing':'thanks'};var kind=map[v.emKind]||'thanks';var st=document.getElementById('emStatus');if(st)st.textContent='Drafting…';GSRUN().withSuccessHandler(function(r){if(r&&r.error){if(st)st.textContent='⚠️ '+r.error;return;}if(st)st.textContent='✅ Draft ready — review &amp; send.';var s=panel.querySelector('[name="emSubject"]');if(s)s.value=r.subject||'';var b=panel.querySelector('[name="emBody"]');if(b)b.value=r.body||'';}).withFailureHandler(function(x){if(st)st.textContent='⚠️ '+x.message;}).draftCandidateEmail(candId,kind);}
function sendCandEmail(candId){var v=collect();if(!v.emBody||!v.emBody.trim()){warn('Draft or write a message first.');return;}var th=add('sending email…','bot think');GSRUN().withSuccessHandler(function(r){th.remove();add(r,'bot');openCandidate(candId);}).withFailureHandler(function(x){th.remove();warn('⚠️ '+x.message);}).sendCandidateEmail(candId,v.emSubject,v.emBody);}
function openReschedule(iid,candId){panel.innerHTML='<div class="nav"><a onclick="openCandidate(\''+candId+'\')">← Candidate</a></div><h3>📅 Reschedule interview</h3>'+fld('New date & time','rdt','datetime-local')+'<div class="acts"><button class="cancel" onclick="openCandidate(\''+candId+'\')">Back</button><button class="save" onclick="submitReschedule(\''+iid+'\',\''+candId+'\')">Update &amp; resend invites</button></div>';overlay.style.display='flex';}
function submitReschedule(iid,candId){var v=collect();if(!v.rdt){warn('Pick a date & time.');return;}var th=add('rescheduling &amp; resending invites…','bot think');GSRUN().withSuccessHandler(function(r){th.remove();add(r,'bot');openCandidate(candId);}).withFailureHandler(function(x){th.remove();warn('⚠️ '+x.message);}).rescheduleInterview(iid,v.rdt);}
function reReview(inp,preReqId){var f=inp.files[0];if(!f)return;var lbl=inp.previousSibling;var rd=new FileReader();rd.onload=function(){GSRUN().withSuccessHandler(function(p){openReviewCandidate(p,f.name,preReqId||'');}).withFailureHandler(function(x){warn('⚠️ '+x.message);}).parseResumeOnly(rd.result.split(',')[1],f.name,f.type);};rd.readAsDataURL(f);}
</script>
</body></html>
